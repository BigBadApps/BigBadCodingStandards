name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check for merge-conflict markers
        run: |
          set +e
          git grep -nE '^(<<<<<<<|>>>>>>>)( |$)'
          rc=$?
          if [ "$rc" -eq 0 ]; then echo "Merge-conflict markers found."; exit 1; fi
          if [ "$rc" -ne 1 ]; then echo "git grep failed (exit $rc)."; exit "$rc"; fi

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Check internal doc links
        run: bash tools/check-links.sh

      - name: Lint shell scripts
        run: shellcheck --severity=warning tools/*.sh

      - name: Self-test tools
        run: |
          bash tools/test-bootstrap.sh
          bash tools/test-check-commits.sh

      - name: Check commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash tools/check-commits.sh "origin/$BASE_REF" HEAD
